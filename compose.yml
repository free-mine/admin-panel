services:
  backend:
    image: ghcr.io/free-mine/admin-server
    env_file: ./.env
    volumes:
      - backend-data:/app/data
    stop_grace_period: 10s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '127.0.0.1:5175:80'

# В будущем вместо volume будет дополнительный сервер.
volumes:
  backend-data:
