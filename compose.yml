services:
  backend:
    image: ghcr.io/free-mine/admin-server
    env_file: .env
    environment:
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:?Set ALLOWED_DOMAIN in .env}
      PANEL_PIN: ${PANEL_PIN:?Set PANEL_PIN in .env}
    volumes:
      - ./backend-data:/app/data
    stop_grace_period: 10s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '127.0.0.1:5175:80'
