map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Treat only numeric loopback origins as localhost. Preserve every other origin
# so the backend still rejects requests from unrelated websites.
map $http_origin $backend_origin {
    default $http_origin;
    "~^(?<loopback_scheme>https?)://(?:127\.0\.0\.1|\[::1\])(?<loopback_port>:[0-9]+)?$" $loopback_scheme://localhost$loopback_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS also lets the UI start before the backend is available.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:3000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Preserve the backend routes, including the WebSocket URL from /v1/config.
    # See https://nginx.org/en/docs/http/websocket.html.
    location ~ ^/(v1(?:/|$)|health$|ready$) {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $backend_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
